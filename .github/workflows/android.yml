name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: APK checksum
        run: |
          cd app/build/outputs/apk/debug
          ls -l
          sha256sum *.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: del-adv-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
      # Public direct-download link for the phone:
      # https://github.com/yichincho/del-adv/releases/latest/download/del-adv.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk del-adv.apk
          sha256sum del-adv.apk > del-adv.apk.sha256
          gh release create "$TAG" del-adv.apk del-adv.apk.sha256 \
            --target "${{ github.sha }}" --latest \
            --title "del-adv $VERSION (build ${{ github.run_number }})" \
            --notes "Debug 簽章的測試版，commit ${{ github.sha }}。升級前請先解除安裝舊版。"
