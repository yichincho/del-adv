<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><style>body{font-family:system-ui,sans-serif;width:320px;padding:16px;background:#f8fafc;color:#172033}h2{margin:0 0 14px}label{display:block;margin:12px 0 5px;font-weight:600}input[type=password],input[type=number]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:12px;padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}small{display:block;line-height:1.5;color:#475569;margin-top:12px}#status{margin-top:10px}</style></head><body><h2>del-adv</h2><label><input type="checkbox" id="enabled"> 啟用自動隱藏</label><label for="apiKey">TypeSafe API Key（選填，啟用 AI 判斷）</label><input id="apiKey" type="password" autocomplete="off" placeholder="貼上你的 API Key"><label for="threshold">AI 隱藏門檻（0–1）</label><input id="threshold" type="number" min="0.5" max="1" step="0.01"><button id="save">儲存設定</button><div id="status" role="status"></div><small>一般廣告標籤以本地規則處理；其他候選項只傳送有限可見文字給 TypeSafe。金鑰儲存於本機瀏覽器，請勿使用於共用電腦。只適用一般網頁，不能修改其他 Android App。</small><script src="popup.js"></script></body></html>
